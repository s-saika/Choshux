<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to My Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0b0f19;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 背景のオーロラグロー効果 */
    .bg-blobs {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      filter: blur(80px);
      opacity: 0.65;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      animation: float 14s infinite ease-in-out alternate;
    }

    .blob-1 {
      width: 480px;
      height: 480px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      top: 15%;
      left: 20%;
      animation-duration: 16s;
    }

    .blob-2 {
      width: 420px;
      height: 420px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      bottom: 15%;
      right: 20%;
      animation-duration: 18s;
      animation-direction: alternate-reverse;
    }

    .blob-3 {
      width: 350px;
      height: 350px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-duration: 12s;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(30px, -40px) scale(1.08);
      }
      100% {
        transform: translate(-20px, 30px) scale(0.95);
      }
    }

    /* グラスモーフィズムカード */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3.5rem 5rem;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45),
                  inset 0 1px 0 rgba(255, 255, 255, 0.12);
      animation: fadeInScale 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* タイトルテキスト */
    .title {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.2;
      background: linear-gradient(135deg, #ffffff 10%, #e2e8f0 50%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 40px rgba(255, 255, 255, 0.1);
      user-select: none;
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* レスポンシブ対応 */
    @media (max-width: 640px) {
      .container {
        padding: 2.2rem 2rem;
        margin: 1.5rem;
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
  <!-- 背景の環境光アニメーション -->
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- メインコンテンツ -->
  <main class="container">
    <h1 class="title">Welcome to My Website</h1>
  </main>
</body>
</html>
