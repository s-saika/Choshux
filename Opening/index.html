<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to My Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Plus+Jakarta+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fcfbf7;
      font-family: 'Playfair Display', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      overflow: hidden;
      position: relative;
      color: #2e302d;
    }

    /* 木漏れ日のような柔らかな光のアニメーション */
    .sunlight-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      filter: blur(75px);
      opacity: 0.75;
      pointer-events: none;
    }

    .light-orb {
      position: absolute;
      border-radius: 50%;
      animation: drift 16s infinite ease-in-out alternate;
    }

    /* 淡いセージグリーン */
    .orb-1 {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, #e2eedc 0%, rgba(226, 238, 220, 0) 70%);
      top: 10%;
      left: 15%;
      animation-duration: 18s;
    }

    /* 温かみのあるペールアプリコット */
    .orb-2 {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, #faead9 0%, rgba(250, 234, 217, 0) 70%);
      bottom: 12%;
      right: 15%;
      animation-duration: 20s;
      animation-direction: alternate-reverse;
    }

    /* 柔らかなペールハニー */
    .orb-3 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #f3f5ea 0%, rgba(243, 245, 234, 0) 70%);
      top: 48%;
      left: 48%;
      transform: translate(-50%, -50%);
      animation-duration: 14s;
    }

    @keyframes drift {
      0% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(25px, -30px) scale(1.06);
      }
      100% {
        transform: translate(-20px, 25px) scale(0.96);
      }
    }

    /* ナチュラルなグラスカード */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 4.2rem 5.5rem;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 25px 50px -12px rgba(92, 85, 75, 0.08),
                  0 0 0 1px rgba(215, 210, 200, 0.25);
      animation: calmFadeIn 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      max-width: 90vw;
    }

    /* 繊細なアクセントライン */
    .decor-line {
      display: inline-block;
      width: 36px;
      height: 1px;
      background-color: #8c9288;
      margin-bottom: 1.5rem;
      opacity: 0.6;
    }

    /* メインタイトル */
    .title {
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 500;
      letter-spacing: 0.02em;
      line-height: 1.25;
      color: #2d302a;
      user-select: none;
    }

    @keyframes calmFadeIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* レスポンシブ対応 */
    @media (max-width: 640px) {
      .container {
        padding: 2.8rem 2rem;
        margin: 1.2rem;
        border-radius: 24px;
      }

      .decor-line {
        margin-bottom: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <!-- 木漏れ日のようなやさしい光 -->
  <div class="sunlight-container" aria-hidden="true">
    <div class="light-orb orb-1"></div>
    <div class="light-orb orb-2"></div>
    <div class="light-orb orb-3"></div>
  </div>

  <!-- メインメッセージ -->
  <main class="container">
    <div class="decor-line" aria-hidden="true"></div>
    <h1 class="title">Welcome to My Website</h1>
  </main>
</body>
</html>
